<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Book | Apple Crisp</title>

    <meta name="description" content="Discover delicious recipes, starting with our homemade Apple Crisp.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Discover delicious recipes, including homemade apple crisp.">
    <meta property="og:url" content="https://kadenjones103.github.io/wdd131/recipes/">
    <meta property="og:image" content="https://kadenjones103.github.io/wdd131/recipes/images/apple-crisp.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Discover delicious recipes, including homemade apple crisp.">
    <meta name="twitter:image" content="https://kadenjones103.github.io/wdd131/recipes/images/apple-crisp.jpg">

    <link rel="icon" href="/favicon.ico">

    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>

        <div class="logo">
            <img src="images/recipe-book.png" alt="Recipe Book logo">
            <h1>RecipeBook</h1>
        </div>

        <!-- Search Bar -->
        <form class="search" role="search">
            <input
                type="search"
                placeholder="Find a recipe"
                aria-label="Find a recipe"
            >

            <button type="submit" aria-label="Search">
                <img src="images/search.svg" alt="">
            </button>
        </form>

    </header>

    <main>

        <section class="recipe">

            <img
                class="recipe-image"
                src="images/apple-crisp.jpg"
                alt="Apple crisp served with vanilla ice cream"
            >

            <div class="recipe-content">

                <span class="category">dessert</span>

                <h2>Apple Crisp</h2>

                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>

                <p class="description">
                    This apple crisp recipe is a simple yet delicious fall
                    dessert that's great served warm with vanilla ice cream.
                </p>

            </div>

        </section>

    </main>

    <footer>

        <div class="social">


            <a href="#" aria-label="Instagram">
                <img src="images/instagram_icon.svg" alt="instagram icon">
            </a>

            <a href="#" aria-label="YouTube">
                <img src="images/youtube_icon.svg" alt="youtube icon">
            </a>

            <a href="#" aria-label="Pinterest">
                <img src="images/pinterest_icon.svg" alt="pinterest icon">
            </a>

        </div>

        <!-- Flaticon Attribution -->
        <a
            href="https://www.flaticon.com/free-icons/recipe"
            title="recipe icons"
        >
            Recipe icons created by Freepik - Flaticon
        </a>

    </footer>

</body>
</html>
